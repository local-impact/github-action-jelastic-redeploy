name: 'Jelastic Redeploy'
description: 'Redeploy containers to a given version in a Jelastic environment'
inputs:
  version:
    description: 'Version of the docker image to deploy'
    required: true
  jelastic_env:
    description: 'Name of the Jelastic environment to redeploy'
    required: true
  jelastic_token:
    description: 'Token to authenticate with Jelastic'
    required: true
  jelastic_url:
    description: 'URL of the Jelastic instance'
    required: true
  deploy_delay:
    description: 'Delay between sequential deploy of containers'
    required: false
    default: 110
  request_timeout:
    description: 'Timeout for the request to Jelastic'
    require: false
    default: 300000
  health_check_path:
    description: >-
      Path requested on the URL of each redeployed container (e.g. /health/) until it answers with a 2xx status,
      before redeploying the next one. Replaces deploy_delay when set.
    required: false
    default: ''
  health_check_timeout:
    description: 'Time in seconds a redeployed container has to pass the health check'
    required: false
    default: 600
  health_check_interval:
    description: 'Time in seconds between two health check attempts'
    required: false
    default: 10
outputs:
  response:
    description: 'Response of the Jelastic request'
runs:
  using: 'node24'
  main: 'main.js'
